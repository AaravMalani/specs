name: Pull Request CI
on:
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g ibm-openapi-validator
      - run: lint-openapi api/openapi.yaml