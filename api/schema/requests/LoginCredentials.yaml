description: The credential pair used by a user to log in
oneOf: 
  - type: object
    properties:
      username:
        $ref: "../components/Username.yaml"
      password:
        $ref: "../components/Password.yaml"
    required: [username, password]
  - type: object
    properties:
      email:
        $ref: "../components/Email.yaml"
      password:
        $ref: "../components/Password.yaml"
    required: [email, password]