description: The credential pair used by a user to log in
oneOf: 
  - type: object
    properties:
      username:
        $ref: "../components/User.yaml#/properties/username"
      password:
        $ref: "../components/Password.yaml"
    required: [username, password]
  - type: object
    properties:
      email:
        $ref: "../components/User.yaml#/properties/email"
      password:
        $ref: "../components/Password.yaml"
    required: [email, password]