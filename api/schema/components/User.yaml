type: object
properties:
  id: 
    type: string
    format: uuid
    minLength: 32
    maxLength: 32
    pattern: "^[a-f0-9]{32}$"
  username: 
    type: string
    description: The username of the user
    minLength: 4
    maxLength: 20
    pattern: "^[a-zA-Z_\\-0-9]*?$"
  email:
    type: string
    description: The email of the user
    format: email
    minLength: 6
    maxLength: 320
  avatarId:
    type: string
    description: The Gravatar ID of the user
    minLength: 32
    maxLength: 32
    pattern: "^[a-f0-9]{32}$"
required: [id, username, email, avatarId]