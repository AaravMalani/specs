type: object
properties:
  id: 
    type: string
    format: uuid
    minLength: 36
    maxLength: 36
  username: 
    type: string
    description: The username of the user
    minLength: 4
    maxLength: 20
    pattern: "^[a-zA-Z_\\-0-9]*?$"
  email:
    type: string
    description: The email of the user
    format: email
    minLength: 6
    maxLength: 320
  avatar_id:
    type: string
    description: The Gravatar ID of the user
    minLength: 64
    maxLength: 64
    pattern: "^[a-f0-9]{64}$"
required: [id, username, email, avatar_id]